version: '3.8'

services:
  # Python OCR Microservice
  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: python_ocr_microservice
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Node.js Backend Gateway
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nodejs_backend_gateway
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - PYTHON_OCR_URL=http://ocr-service:8000
    depends_on:
      ocr-service:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: document_ai_network
