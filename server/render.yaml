# Render Blueprint — optional; or copy these settings into the dashboard manually.
services:
  - type: web
    name: jikadara-pandav-associates
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
